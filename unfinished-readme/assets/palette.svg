<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Paleta: preto, papel, vermelho e uma faixa mínima de verde, que quase nunca aparece">
<title>Paleta</title>
<rect width="1200" height="150" fill="#080808"/>
<rect x="0" y="20" width="690" height="90" fill="#080808" stroke="#f2f0eb" stroke-opacity="0.35" stroke-width="1">
  <animate attributeName="width" from="0" to="690" dur="0.9s" begin="0.00s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.2 1"/>
</rect>
<text x="14" y="98" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#f2f0eb">preto  #080808</text>
<rect x="702" y="20" width="280" height="90" fill="#f2f0eb">
  <animate attributeName="width" from="0" to="280" dur="0.9s" begin="0.35s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.2 1"/>
</rect>
<text x="716" y="98" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#111">papel  #f2f0eb</text>
<rect x="994" y="20" width="170" height="90" fill="#b52f2b">
  <animate attributeName="width" from="0" to="170" dur="0.9s" begin="0.70s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.7 0 0.2 1"/>
</rect>
<text x="1008" y="98" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#f2f0eb">vermelho  #b52f2b</text>
<rect x="1176" y="20" width="24" height="90" fill="#9bb34a">
  <animate attributeName="opacity" values="1;1;0.2;1" keyTimes="0;0.5;0.8;1" dur="3s" repeatCount="indefinite"/>
</rect>
<text x="1188" y="138" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#9bb34a">quase nunca</text>
</svg>
