<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Still unfinished.">
<title>Still unfinished.</title>
<rect width="1200" height="270" fill="#080808"/>
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;-6 3;0 0" dur="10s" repeatCount="indefinite"/>
  <polygon fill="#b52f2b" points="900,0 1200,0 1200,150 1150,126 1118,170 1070,104 1030,140 990,60 940,84"/>
</g>
<circle cx="56" cy="56" r="9" fill="#b52f2b"><animate attributeName="r" values="9;12;9" dur="3s" repeatCount="indefinite"/></circle>
<text x="100" y="124" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="100" textLength="340" lengthAdjust="spacingAndGlyphs" fill="#f2f0eb">STILL</text>
<text x="100" y="238" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="100" textLength="960" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#f2f0eb" stroke-width="1.5">UNFINISHED.</text>
<rect x="1080" y="166" width="22" height="74" fill="#b52f2b">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5001;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
<circle cx="1160" cy="236" r="5" fill="#9bb34a">
  <animate attributeName="opacity" values="1;1;0.15;1" keyTimes="0;0.5;0.75;1" dur="2.4s" repeatCount="indefinite"/>
</circle>
</svg>
