<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Linha do tempo de seis semanas, de Start até a apresentação em 30 de novembro e 4 de dezembro">
<title>Caminho de seis semanas</title>
<rect width="1200" height="210" fill="#080808"/>
<line x1="100" y1="100" x2="1100" y2="100" stroke="#f2f0eb" stroke-opacity="0.2" stroke-width="2"/>
<line x1="100" y1="100" x2="1100" y2="100" stroke="#b52f2b" stroke-width="3" stroke-dasharray="1000" stroke-dashoffset="1000">
  <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;0.55;0.92;1" dur="11.0s" repeatCount="indefinite"/>
</line>
<circle cx="100" cy="100" r="10" fill="#080808" stroke="#f2f0eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0000;0.0200;0.92;1" dur="11.0s" repeatCount="indefinite"/></circle>
<text x="100" y="62" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#b52f2b">S1</text>
<text x="100" y="150" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#f2f0eb">Start</text>
<text x="100" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#aaa6a0">definição</text>
<circle cx="300" cy="100" r="10" fill="#080808" stroke="#f2f0eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1100;0.1300;0.92;1" dur="11.0s" repeatCount="indefinite"/></circle>
<text x="300" y="62" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#b52f2b">S2</text>
<text x="300" y="150" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#f2f0eb">Tema</text>
<text x="300" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#aaa6a0">documentação</text>
<circle cx="500" cy="100" r="10" fill="#080808" stroke="#f2f0eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2200;0.2400;0.92;1" dur="11.0s" repeatCount="indefinite"/></circle>
<text x="500" y="62" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#b52f2b">S3</text>
<text x="500" y="150" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#f2f0eb">Início do site</text>
<text x="500" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#aaa6a0">home e identidade</text>
<circle cx="700" cy="100" r="10" fill="#080808" stroke="#f2f0eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3300;0.3500;0.92;1" dur="11.0s" repeatCount="indefinite"/></circle>
<text x="700" y="62" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#b52f2b">S4</text>
<text x="700" y="150" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#f2f0eb">Dados</text>
<text x="700" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#aaa6a0">banco e API</text>
<circle cx="900" cy="100" r="10" fill="#080808" stroke="#f2f0eb" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4400;0.4600;0.92;1" dur="11.0s" repeatCount="indefinite"/></circle>
<text x="900" y="62" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#b52f2b">S5</text>
<text x="900" y="150" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#f2f0eb">Dashboard</text>
<text x="900" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#aaa6a0">visualização</text>
<circle cx="1100" cy="100" r="12" fill="#b52f2b" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5500;0.5700;0.92;1" dur="11.0s" repeatCount="indefinite"/></circle>
<text x="1100" y="62" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#b52f2b">S6</text>
<text x="1100" y="150" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#f2f0eb">Apresentação</text>
<text x="1100" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#aaa6a0">30/11 e 4/12</text>
</svg>
